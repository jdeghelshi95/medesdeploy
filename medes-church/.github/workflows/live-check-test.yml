name: Test YouTube live check from GitHub runner

on:
  push:
    branches:
      - test-live-check

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-live-check

      - name: Check YouTube live status
        run: node .github/scripts/check-live.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-result.json
          git commit -m "Test result $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
